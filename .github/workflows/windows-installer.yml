name: Windows installer

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact immutable 40-char SHA, or an existing tag"
        required: true
        type: string
      tag:
        description: "Release tag to upload (empty = gate+build only). Must resolve to the same commit as ref; version must match csproj and NSIS."
        required: false
        default: ""
        type: string
      allow_unsigned_release:
        description: "Permit a tagged release without Azure Trusted Signing. Unsigned binaries get SmartScreen warnings. Default false."
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      HAS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' }}
      REQUESTED_REF: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.tag }}
      ALLOW_UNSIGNED: ${{ inputs.allow_unsigned_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Pin exact immutable checkout
        shell: pwsh
        run: |
          $want = $env:REQUESTED_REF.Trim()
          $head = (git rev-parse HEAD).ToLower()
          Write-Host "requested=$want"
          Write-Host "HEAD=$head"
          Write-Host "HAS_SIGNING=$($env:HAS_SIGNING)"
          Write-Host "ALLOW_UNSIGNED=$($env:ALLOW_UNSIGNED)"
          Write-Host "RELEASE_TAG=$($env:RELEASE_TAG)"
          git log -1 --oneline
          if ($want -match '^[0-9a-fA-F]{40}$') {
            if ($head -ne $want.ToLower()) {
              throw "checkout HEAD $head != requested SHA $want"
            }
          } elseif ($want -match '^[0-9a-fA-F]{7,39}$') {
            throw "short SHA is not immutable; pass a 40-char SHA or a tag"
          } else {
            $tagSha = (git rev-parse "refs/tags/$want^{commit}" 2>$null)
            if ($LASTEXITCODE -ne 0 -or -not $tagSha) {
              throw "ref is not a 40-char SHA or an existing tag: $want"
            }
            if ($head -ne $tagSha.ToLower()) {
              throw "tag $want resolves to $tagSha, HEAD is $head"
            }
          }

      - name: git diff --check
        shell: pwsh
        run: |
          git diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }

      - name: Assert tag matches HEAD, csproj, NSIS
        if: inputs.tag != ''
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "release tag must match ^v\\d+\\.\\d+\\.\\d+$ (got: $tag)"
          }
          $head = (git rev-parse HEAD).ToLower()
          $tagSha = (git rev-parse "refs/tags/$tag^{commit}" 2>$null)
          if ($LASTEXITCODE -ne 0 -or -not $tagSha) {
            throw "release tag does not exist: $tag"
          }
          if ($tagSha.ToLower() -ne $head) {
            throw "tag $tag is $tagSha, HEAD is $head"
          }
          $csprojRaw = Get-Content windows/Snippr.Win.csproj -Raw
          $nsisRaw = Get-Content windows/installer.nsi -Raw
          if ($csprojRaw -notmatch '<Version>([^<]+)</Version>') {
            throw "csproj Version missing"
          }
          $csproj = $Matches[1].Trim()
          if ($nsisRaw -notmatch 'OutFile "SnipprSetup-([^"]+)-win-x64.exe"') {
            throw "NSIS OutFile version missing"
          }
          $nsisOut = $Matches[1].Trim()
          if ($nsisRaw -notmatch 'DisplayVersion" "([^"]+)"') {
            throw "NSIS DisplayVersion missing"
          }
          $nsisDisp = $Matches[1].Trim()
          $ver = $tag.TrimStart('v')
          Write-Host "tag=$tag ver=$ver csproj=$csproj nsisOut=$nsisOut nsisDisp=$nsisDisp"
          if ($ver -ne $csproj -or $ver -ne $nsisOut -or $ver -ne $nsisDisp) {
            throw "version mismatch: tag=$ver csproj=$csproj nsisOut=$nsisOut nsisDisp=$nsisDisp"
          }

      - name: Require signing secrets or explicit unsigned flag
        if: inputs.tag != ''
        shell: pwsh
        run: |
          Write-Host "HAS_SIGNING=$($env:HAS_SIGNING) ALLOW_UNSIGNED=$($env:ALLOW_UNSIGNED)"
          if ($env:HAS_SIGNING -ne 'true' -and $env:ALLOW_UNSIGNED -ne 'true') {
            throw "tagged release requires Azure Trusted Signing secrets, or allow_unsigned_release=true"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Approved cross-platform icon gate
        shell: pwsh
        run: |
          $approvedMaster = 'c6e6e20df44db307d88b5037b911f4cd5a112daee173a767bc9966560635f106'
          $masterHash = (Get-FileHash -Algorithm SHA256 Support/icon-1024.png).Hash.ToLower()
          if ($masterHash -ne $approvedMaster) {
            throw "icon master mismatch: expected $approvedMaster got $masterHash"
          }

          $bytes = [IO.File]::ReadAllBytes('windows/snippr.ico')
          $approvedICO = '8d2005c8f5b0ddc750a00f6c6fe55d197da076d4203023843607c48f04705860'
          $icoHash = (Get-FileHash -Algorithm SHA256 windows/snippr.ico).Hash.ToLower()
          if ($icoHash -ne $approvedICO) {
            throw "ICO hash mismatch: expected $approvedICO got $icoHash"
          }
          if ($bytes.Length -lt 6 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0 -or
              [BitConverter]::ToUInt16($bytes, 2) -ne 1) {
            throw 'invalid ICO header'
          }
          $count = [BitConverter]::ToUInt16($bytes, 4)
          $expectedSizes = @(16, 24, 32, 48, 64, 128, 256)
          if ($count -ne $expectedSizes.Count) {
            throw "ICO frame count mismatch: expected $($expectedSizes.Count) got $count"
          }

          function Read-BigEndianUInt32([byte[]]$data, [int]$offset) {
            return ([uint32]$data[$offset] -shl 24) -bor
              ([uint32]$data[$offset + 1] -shl 16) -bor
              ([uint32]$data[$offset + 2] -shl 8) -bor
              [uint32]$data[$offset + 3]
          }
          function Get-ByteSHA256([byte[]]$data) {
            return [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($data)
            ).ToLower()
          }

          $matchingFiles = @{
            16 = 'Support/AppIcon.iconset/icon_16x16.png'
            32 = 'Support/AppIcon.iconset/icon_32x32.png'
            64 = 'Support/AppIcon.iconset/icon_64x64.png'
            128 = 'Support/AppIcon.iconset/icon_128x128.png'
            256 = 'site/icon.png'
          }
          $approvedFrameHashes = @{
            16 = 'e5a47a623fbebbcb03ef1c856101755ce6a0c24b86d41f05552839d6854bc727'
            24 = '70d2182be393ee6882bc541169ded1479d7176ccf452401b19ba29c785c24d26'
            32 = '26e921b30057e976012e2bfc9e000ff4443a0662259da0a957923a6bfdec79e4'
            48 = '31410165a914eb131f16a69f203c0d574d34b49cca4cf27953325dd782f60efb'
            64 = '180932d25d29501746c6b7c8d060cfdfe9b6b505f4e87e438e4db46153969c4d'
            128 = 'ffac1d9e81e4d807d080882d3bdac92eea9107207243c3404ef07ac48bd734f7'
            256 = '08d5b6da85f8cd1a61ad34370844fb2ca0ff03956c2256c4825b5e60135f039c'
          }
          $seen = @()
          $expectedOffset = 6 + $count * 16
          for ($index = 0; $index -lt $count; $index++) {
            $entry = 6 + $index * 16
            $width = [int]$bytes[$entry]
            $height = [int]$bytes[$entry + 1]
            if ($width -eq 0) { $width = 256 }
            if ($height -eq 0) { $height = 256 }
            if ($width -ne $height) { throw "ICO frame is not square: ${width}x${height}" }
            if ($bytes[$entry + 2] -ne 0 -or $bytes[$entry + 3] -ne 0) {
              throw "ICO frame $width has invalid color-count/reserved fields"
            }
            if ([BitConverter]::ToUInt16($bytes, $entry + 4) -ne 1 -or
                [BitConverter]::ToUInt16($bytes, $entry + 6) -ne 32) {
              throw "ICO frame $width must be one-plane 32bpp"
            }
            $length = [BitConverter]::ToUInt32($bytes, $entry + 8)
            $offset = [BitConverter]::ToUInt32($bytes, $entry + 12)
            if ($offset -ne $expectedOffset) {
              throw "ICO frame $width offset is not contiguous: expected $expectedOffset got $offset"
            }
            if ($length -lt 24 -or $offset + $length -gt $bytes.Length) {
              throw "ICO frame $width has invalid bounds"
            }
            [byte[]]$payload = $bytes[$offset..($offset + $length - 1)]
            $pngSignature = @(137, 80, 78, 71, 13, 10, 26, 10)
            for ($byteIndex = 0; $byteIndex -lt $pngSignature.Count; $byteIndex++) {
              if ($payload[$byteIndex] -ne $pngSignature[$byteIndex]) {
                throw "ICO frame $width is not PNG-compressed"
              }
            }
            $pngWidth = Read-BigEndianUInt32 $payload 16
            $pngHeight = Read-BigEndianUInt32 $payload 20
            if ($pngWidth -ne $width -or $pngHeight -ne $height) {
              throw "ICO directory/payload dimension mismatch: ${width}x${height} vs ${pngWidth}x${pngHeight}"
            }
            $payloadHash = Get-ByteSHA256 $payload
            if ($payloadHash -ne $approvedFrameHashes[$width]) {
              throw "ICO frame $width is not the approved logo derivative"
            }
            if ($matchingFiles.ContainsKey($width)) {
              $sourceHash = (Get-FileHash -Algorithm SHA256 $matchingFiles[$width]).Hash.ToLower()
              if ($payloadHash -ne $sourceHash) {
                throw "ICO frame $width differs from $($matchingFiles[$width])"
              }
            }
            $seen += $width
            $expectedOffset = $offset + $length
          }
          if (($seen -join ',') -ne ($expectedSizes -join ',')) {
            throw "ICO frame sizes/order mismatch: $($seen -join ',')"
          }
          if ($expectedOffset -ne $bytes.Length) {
            throw "ICO has trailing or unreferenced data: expected end $expectedOffset got $($bytes.Length)"
          }
          Write-Host "approved icon master + ICO frames PASS: $($seen -join ',')"

      - name: Stitcher gate (animated-band + majority fail-closed)
        run: >
          dotnet run --project windows/Snippr.Win.StitcherGate/Snippr.Win.StitcherGate.csproj
          -c Release --no-launch-profile

      - name: Build Win app (Release)
        run: dotnet build windows/Snippr.Win.csproj -c Release

      - name: Verify app executable embeds approved icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing.Common
          $exe = @(Get-ChildItem windows/bin/Release -Recurse -Filter Snippr.exe |
            Where-Object { $_.FullName -notlike '*publish*' }) | Select-Object -First 1
          if (-not $exe) { throw 'built Snippr.exe not found' }
          $expectedIcon = [Drawing.Icon]::new((Resolve-Path windows/snippr.ico).Path, 32, 32)
          $actualIcon = [Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if (-not $actualIcon) { throw "embedded icon missing from $($exe.FullName)" }
          $expected = $expectedIcon.ToBitmap()
          $actual = $actualIcon.ToBitmap()
          try {
            if ($actual.Width -ne $expected.Width -or $actual.Height -ne $expected.Height) {
              throw "embedded icon dimensions differ: $($actual.Width)x$($actual.Height)"
            }
            for ($y = 0; $y -lt $expected.Height; $y++) {
              for ($x = 0; $x -lt $expected.Width; $x++) {
                if ($actual.GetPixel($x, $y).ToArgb() -ne $expected.GetPixel($x, $y).ToArgb()) {
                  throw "embedded icon pixel mismatch at $x,$y"
                }
              }
            }
          } finally {
            $expected.Dispose()
            $actual.Dispose()
            $expectedIcon.Dispose()
            $actualIcon.Dispose()
          }
          Write-Host "embedded app icon PASS: $($exe.FullName)"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Gate NSIS consumes approved icon
        if: inputs.tag == ''
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem windows/bin/Release -Recurse -Filter Snippr.exe |
            Where-Object { $_.FullName -notlike '*publish*' }) | Select-Object -First 1
          if (-not $exe) { throw 'built Snippr.exe not found for NSIS smoke gate' }
          Copy-Item $exe.FullName windows/Snippr.exe -Force
          Push-Location windows
          try {
            & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $setup = @(Get-Item windows/SnipprSetup-*.exe -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) {
            throw "NSIS smoke expected exactly one setup exe, got $($setup.Count)"
          }
          $nsisRaw = Get-Content windows/installer.nsi -Raw
          $csprojRaw = Get-Content windows/Snippr.Win.csproj -Raw
          if ($nsisRaw -notmatch 'OutFile "(SnipprSetup-([^\"]+)-win-x64\.exe)"') {
            throw 'NSIS smoke could not read installer output/version'
          }
          $expectedSetup = $Matches[1]
          $nsisVersion = $Matches[2]
          if ($csprojRaw -notmatch '<Version>([^<]+)</Version>') {
            throw 'NSIS smoke could not read csproj version'
          }
          $csprojVersion = $Matches[1].Trim()
          if ($setup[0].Name -ne $expectedSetup -or $nsisVersion -ne $csprojVersion) {
            throw "NSIS smoke version mismatch: setup=$($setup[0].Name) expected=$expectedSetup nsis=$nsisVersion csproj=$csprojVersion"
          }

          Add-Type -AssemblyName System.Drawing.Common
          $expectedIcon = [Drawing.Icon]::new((Resolve-Path windows/snippr.ico).Path, 32, 32)
          $actualIcon = [Drawing.Icon]::ExtractAssociatedIcon($setup[0].FullName)
          if (-not $actualIcon) { throw 'NSIS setup embedded icon missing' }
          $expected = $expectedIcon.ToBitmap()
          $actual = $actualIcon.ToBitmap()
          try {
            if ($actual.Width -ne $expected.Width -or $actual.Height -ne $expected.Height) {
              throw "NSIS icon dimensions differ: $($actual.Width)x$($actual.Height)"
            }
            for ($y = 0; $y -lt $expected.Height; $y++) {
              for ($x = 0; $x -lt $expected.Width; $x++) {
                if ($actual.GetPixel($x, $y).ToArgb() -ne $expected.GetPixel($x, $y).ToArgb()) {
                  throw "NSIS setup icon pixel mismatch at $x,$y"
                }
              }
            }
          } finally {
            $expected.Dispose()
            $actual.Dispose()
            $expectedIcon.Dispose()
            $actualIcon.Dispose()
          }
          Write-Host "NSIS setup icon PASS: $($setup[0].FullName)"

      - name: Publish self-contained exe
        if: inputs.tag != ''
        run: >
          dotnet publish windows/Snippr.Win.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:TieredPGO=true

      - name: Stage exe next to installer script
        if: inputs.tag != ''
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path windows -Filter Snippr.exe |
            Where-Object { $_.FullName -like '*publish*' } | Select-Object -First 1
          if (-not $exe) { throw "publish output not found" }
          Write-Host "Found $($exe.FullName)"
          Copy-Item $exe.FullName windows/Snippr.exe

      - name: Sign Snippr.exe (Azure Trusted Signing)
        if: inputs.tag != '' && env.HAS_SIGNING == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build NSIS installer
        if: inputs.tag != ''
        shell: pwsh
        working-directory: windows
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi'

      - name: Sign installer (Azure Trusted Signing)
        if: inputs.tag != '' && env.HAS_SIGNING == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Portable ZIP
        if: inputs.tag != ''
        shell: pwsh
        run: >
          Compress-Archive -Path windows/Snippr.exe
          -DestinationPath windows/Snippr-portable-win-x64.zip -Force

      - name: Verify Authenticode and SHA-256
        if: inputs.tag != ''
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing.Common
          function Assert-EmbeddedIcon([string]$path) {
            if (-not (Test-Path $path)) { throw "missing $path" }
            $expectedIcon = [Drawing.Icon]::new((Resolve-Path windows/snippr.ico).Path, 32, 32)
            $actualIcon = [Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $path).Path)
            if (-not $actualIcon) { throw "embedded icon missing from $path" }
            $expected = $expectedIcon.ToBitmap()
            $actual = $actualIcon.ToBitmap()
            try {
              if ($actual.Width -ne $expected.Width -or $actual.Height -ne $expected.Height) {
                throw "embedded icon dimensions differ for $path"
              }
              for ($y = 0; $y -lt $expected.Height; $y++) {
                for ($x = 0; $x -lt $expected.Width; $x++) {
                  if ($actual.GetPixel($x, $y).ToArgb() -ne $expected.GetPixel($x, $y).ToArgb()) {
                    throw "embedded icon mismatch in $path at $x,$y"
                  }
                }
              }
            } finally {
              $expected.Dispose()
              $actual.Dispose()
              $expectedIcon.Dispose()
              $actualIcon.Dispose()
            }
            Write-Host "embedded icon ok $path"
          }
          function Get-SetupExe([string]$dir) {
            $setup = @(Get-Item (Join-Path $dir 'SnipprSetup-*.exe') -ErrorAction SilentlyContinue)
            if ($setup.Count -ne 1) {
              throw "expected exactly 1 $dir/SnipprSetup-*.exe, got $($setup.Count)"
            }
            if ($setup[0].Name -notmatch '^SnipprSetup-\d+\.\d+\.\d+-win-x64\.exe$') {
              throw "setup filename not exact: $($setup[0].Name)"
            }
            return $setup[0]
          }
          function Assert-Authenticode([string]$path, [bool]$expectSigned) {
            if (-not (Test-Path $path)) { throw "missing $path" }
            $s = Get-AuthenticodeSignature $path
            Write-Host "$path Status=$($s.Status) Thumbprint=$($s.SignerCertificate.Thumbprint)"
            if ($expectSigned) {
              if ($s.Status -ne 'Valid') {
                throw "Authenticode not Valid: $path $($s.Status)"
              }
            } else {
              # Explicit unsigned: only NotSigned is acceptable.
              # UnknownError / HashMismatch / anything else is a hard fail.
              if ($s.Status -ne 'NotSigned') {
                throw "explicit unsigned release requires NotSigned (rejected $($s.Status)): $path"
              }
            }
          }
          function Assert-ReleaseManifest([string]$dir, [bool]$expectSigned) {
            $sumsPath = Join-Path $dir 'SHA256SUMS'
            if (-not (Test-Path $sumsPath)) { throw "missing $sumsPath" }
            $setup = Get-SetupExe $dir
            $required = @('Snippr.exe', $setup.Name, 'Snippr-portable-win-x64.zip')
            $raw = @(Get-Content $sumsPath)
            $expectedCount = 3
            if (-not $expectSigned) { $expectedCount = 4 }
            if ($raw.Count -ne $expectedCount) {
              throw "SHA256SUMS must have exactly $expectedCount lines (3 hashes$(if ($expectSigned) { '' } else { ' + UNSIGNED_RELEASE=true' })), got $($raw.Count)"
            }
            $seen = @{}
            $markerCount = 0
            foreach ($line in $raw) {
              if ($line -eq 'UNSIGNED_RELEASE=true') {
                $markerCount++
                continue
              }
              if ($line -notmatch '^([0-9a-f]{64})  (\S+)$') {
                throw "SHA256SUMS unexpected line: $line"
              }
              $hash = $Matches[1]
              $name = $Matches[2]
              if ($seen.ContainsKey($name)) {
                throw "SHA256SUMS duplicate filename: $name"
              }
              if ($name -notin $required) {
                throw "SHA256SUMS extra filename: $name"
              }
              $seen[$name] = $hash
            }
            if ($expectSigned) {
              if ($markerCount -ne 0) {
                throw "UNSIGNED_RELEASE marker present but signed release"
              }
            } else {
              if ($markerCount -ne 1) {
                throw "unsigned release requires exactly one UNSIGNED_RELEASE=true marker, got $markerCount"
              }
            }
            $missing = @($required | Where-Object { -not $seen.ContainsKey($_) })
            if ($missing.Count -ne 0) {
              throw "SHA256SUMS missing filename(s): $($missing -join ', ')"
            }
            if ($seen.Count -ne 3) {
              throw "SHA256SUMS must list exactly 3 unique filenames, got $($seen.Count)"
            }
            foreach ($name in $required) {
              $path = Join-Path $dir $name
              if (-not (Test-Path $path)) { throw "missing $path listed in SHA256SUMS" }
              $got = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
              if ($got -ne $seen[$name]) {
                throw "SHA-256 mismatch $name expected $($seen[$name]) got $got"
              }
              Write-Host "sha256 ok $name"
            }
            return $setup
          }
          $setup = Get-SetupExe 'windows'
          $expectSigned = ($env:HAS_SIGNING -eq 'true')
          Assert-Authenticode windows/Snippr.exe $expectSigned
          Assert-Authenticode $setup.FullName $expectSigned
          Assert-EmbeddedIcon windows/Snippr.exe
          Assert-EmbeddedIcon $setup.FullName
          if (-not (Test-Path windows/Snippr-portable-win-x64.zip)) {
            throw "missing windows/Snippr-portable-win-x64.zip"
          }
          $lines = @()
          foreach ($name in @('Snippr.exe', $setup.Name, 'Snippr-portable-win-x64.zip')) {
            $h = Get-FileHash -Algorithm SHA256 (Join-Path 'windows' $name)
            $line = "$($h.Hash.ToLower())  $name"
            Write-Host $line
            $lines += $line
          }
          if (-not $expectSigned) {
            $lines += 'UNSIGNED_RELEASE=true'
            Write-Host "UNSIGNED_RELEASE=true"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Unsigned release"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '`UNSIGNED_RELEASE=true`'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Azure Trusted Signing was not configured. Authenticode Status=NotSigned on Snippr.exe and the setup exe. SmartScreen will warn."
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Signed release"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Authenticode Status=Valid on Snippr.exe and the setup exe."
          }
          $lines | Set-Content -Encoding ascii windows/SHA256SUMS
          [void](Assert-ReleaseManifest 'windows' $expectSigned)
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item $setup.FullName dist/
          Copy-Item windows/Snippr.exe dist/portable/
          Copy-Item windows/Snippr-portable-win-x64.zip dist/portable/
          Copy-Item windows/SHA256SUMS dist/

      - name: Upload verified setup
        if: inputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          if-no-files-found: error
          path: dist/SnipprSetup-*.exe

      - name: Upload verified portable zip
        if: inputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          if-no-files-found: error
          path: dist/portable/

      - name: Upload verified checksums
        if: inputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-checksums
          if-no-files-found: error
          path: dist/SHA256SUMS

  release:
    needs: build
    if: inputs.tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' }}
      RELEASE_TAG: ${{ inputs.tag }}
      ALLOW_UNSIGNED: ${{ inputs.allow_unsigned_release }}
    steps:
      - name: Download verified setup
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: windows

      - name: Download verified portable zip
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: windows

      - name: Download verified checksums
        uses: actions/download-artifact@v4
        with:
          name: windows-checksums
          path: windows

      - name: Recheck SHA-256 and Authenticode
        shell: pwsh
        run: |
          function Get-SetupExe([string]$dir) {
            $setup = @(Get-Item (Join-Path $dir 'SnipprSetup-*.exe') -ErrorAction SilentlyContinue)
            if ($setup.Count -ne 1) {
              throw "expected exactly 1 $dir/SnipprSetup-*.exe, got $($setup.Count)"
            }
            if ($setup[0].Name -notmatch '^SnipprSetup-\d+\.\d+\.\d+-win-x64\.exe$') {
              throw "setup filename not exact: $($setup[0].Name)"
            }
            return $setup[0]
          }
          function Assert-Authenticode([string]$path, [bool]$expectSigned) {
            if (-not (Test-Path $path)) { throw "missing $path" }
            $s = Get-AuthenticodeSignature $path
            Write-Host "$path Status=$($s.Status) Thumbprint=$($s.SignerCertificate.Thumbprint)"
            if ($expectSigned) {
              if ($s.Status -ne 'Valid') {
                throw "Authenticode not Valid: $path $($s.Status)"
              }
            } else {
              if ($s.Status -ne 'NotSigned') {
                throw "explicit unsigned release requires NotSigned (rejected $($s.Status)): $path"
              }
            }
          }
          function Assert-ReleaseManifest([string]$dir, [bool]$expectSigned) {
            $sumsPath = Join-Path $dir 'SHA256SUMS'
            if (-not (Test-Path $sumsPath)) { throw "missing $sumsPath" }
            $setup = Get-SetupExe $dir
            $required = @('Snippr.exe', $setup.Name, 'Snippr-portable-win-x64.zip')
            $raw = @(Get-Content $sumsPath)
            $expectedCount = 3
            if (-not $expectSigned) { $expectedCount = 4 }
            if ($raw.Count -ne $expectedCount) {
              throw "SHA256SUMS must have exactly $expectedCount lines (3 hashes$(if ($expectSigned) { '' } else { ' + UNSIGNED_RELEASE=true' })), got $($raw.Count)"
            }
            $seen = @{}
            $markerCount = 0
            foreach ($line in $raw) {
              if ($line -eq 'UNSIGNED_RELEASE=true') {
                $markerCount++
                continue
              }
              if ($line -notmatch '^([0-9a-f]{64})  (\S+)$') {
                throw "SHA256SUMS unexpected line: $line"
              }
              $hash = $Matches[1]
              $name = $Matches[2]
              if ($seen.ContainsKey($name)) {
                throw "SHA256SUMS duplicate filename: $name"
              }
              if ($name -notin $required) {
                throw "SHA256SUMS extra filename: $name"
              }
              $seen[$name] = $hash
            }
            if ($expectSigned) {
              if ($markerCount -ne 0) {
                throw "UNSIGNED_RELEASE marker present but signed release"
              }
            } else {
              if ($markerCount -ne 1) {
                throw "unsigned release requires exactly one UNSIGNED_RELEASE=true marker, got $markerCount"
              }
            }
            $missing = @($required | Where-Object { -not $seen.ContainsKey($_) })
            if ($missing.Count -ne 0) {
              throw "SHA256SUMS missing filename(s): $($missing -join ', ')"
            }
            if ($seen.Count -ne 3) {
              throw "SHA256SUMS must list exactly 3 unique filenames, got $($seen.Count)"
            }
            foreach ($name in $required) {
              $path = Join-Path $dir $name
              if (-not (Test-Path $path)) { throw "missing $path listed in SHA256SUMS" }
              $got = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
              if ($got -ne $seen[$name]) {
                throw "SHA-256 mismatch $name expected $($seen[$name]) got $got"
              }
              Write-Host "sha256 ok $name"
            }
            return $setup
          }
          $expectSigned = ($env:HAS_SIGNING -eq 'true')
          if ($expectSigned) {
            if ($env:ALLOW_UNSIGNED -eq 'true') {
              Write-Host "allow_unsigned_release=true ignored because HAS_SIGNING=true; releasing signed"
            }
          } else {
            if ($env:ALLOW_UNSIGNED -ne 'true') {
              throw "release job reached unsigned path without allow_unsigned_release=true"
            }
          }
          $setup = Assert-ReleaseManifest 'windows' $expectSigned
          Assert-Authenticode windows/Snippr.exe $expectSigned
          Assert-Authenticode $setup.FullName $expectSigned

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "release tag must match ^v\\d+\\.\\d+\\.\\d+$ (got: $tag)"
          }
          $setup = @(Get-Item windows/SnipprSetup-*.exe -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) {
            throw "expected exactly 1 windows/SnipprSetup-*.exe, got $($setup.Count)"
          }
          if ($setup[0].Name -notmatch '^SnipprSetup-\d+\.\d+\.\d+-win-x64\.exe$') {
            throw "setup filename not exact: $($setup[0].Name)"
          }
          foreach ($name in @($setup[0].Name, 'Snippr-portable-win-x64.zip', 'SHA256SUMS')) {
            $path = Join-Path 'windows' $name
            if (-not (Test-Path $path)) { throw "refusing upload; missing $path" }
          }
          # No --clobber: refuse to overwrite an existing release asset.
          # Tag is taken from $env:RELEASE_TAG (allowlisted), never interpolated into the script.
          # This job is the only one with contents: write; the gate-only path never reaches here.
          gh release upload $tag `
            $setup[0].FullName `
            windows/Snippr-portable-win-x64.zip `
            windows/SHA256SUMS
