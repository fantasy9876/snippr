name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload the installer to"
        required: true
        default: "v1.0.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Signing turns on automatically once the Azure Trusted Signing
      # secrets are added in repo Settings → Secrets and variables → Actions.
      ENABLE_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained exe
        # ReadyToRun precompiles IL to native code: the tray app and the
        # editor open without paying JIT cost on first use.
        run: >
          dotnet publish windows/Snippr.Win.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:TieredPGO=true

      - name: Stage exe next to installer script
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path windows -Filter Snippr.exe |
            Where-Object { $_.FullName -like '*publish*' } | Select-Object -First 1
          if (-not $exe) { throw "publish output not found" }
          Write-Host "Found $($exe.FullName)"
          Copy-Item $exe.FullName windows/Snippr.exe

      - name: Sign Snippr.exe (Azure Trusted Signing)
        if: env.ENABLE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        working-directory: windows
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi'

      - name: Sign installer (Azure Trusted Signing)
        if: env.ENABLE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Portable ZIP
        shell: pwsh
        run: >
          Compress-Archive -Path windows/Snippr.exe
          -DestinationPath windows/Snippr-portable-win-x64.zip -Force

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload ${{ inputs.tag }} (Get-Item windows/SnipprSetup-*.exe).FullName --clobber
          gh release upload ${{ inputs.tag }} windows/Snippr-portable-win-x64.zip --clobber
