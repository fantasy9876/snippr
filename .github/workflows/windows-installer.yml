name: Windows installer

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact immutable 40-char SHA, or an existing tag"
        required: true
        type: string
      tag:
        description: "Release tag to upload (empty = gate+build only). Must resolve to the same commit as ref; version must match csproj and NSIS."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' }}
      REQUESTED_REF: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Pin exact immutable checkout
        shell: pwsh
        run: |
          $want = $env:REQUESTED_REF.Trim()
          $head = (git rev-parse HEAD).ToLower()
          Write-Host "requested=$want"
          Write-Host "HEAD=$head"
          git log -1 --oneline
          if ($want -match '^[0-9a-fA-F]{40}$') {
            if ($head -ne $want.ToLower()) {
              throw "checkout HEAD $head != requested SHA $want"
            }
          } elseif ($want -match '^[0-9a-fA-F]{7,39}$') {
            throw "short SHA is not immutable; pass a 40-char SHA or a tag"
          } else {
            $tagSha = (git rev-parse "refs/tags/$want^{commit}" 2>$null)
            if ($LASTEXITCODE -ne 0 -or -not $tagSha) {
              throw "ref is not a 40-char SHA or an existing tag: $want"
            }
            if ($head -ne $tagSha.ToLower()) {
              throw "tag $want resolves to $tagSha, HEAD is $head"
            }
          }

      - name: git diff --check
        shell: pwsh
        run: |
          git diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }

      - name: Assert tag matches HEAD, csproj, NSIS
        if: inputs.tag != ''
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "release tag must match ^v\\d+\\.\\d+\\.\\d+$ (got: $tag)"
          }
          $head = (git rev-parse HEAD).ToLower()
          $tagSha = (git rev-parse "refs/tags/$tag^{commit}" 2>$null)
          if ($LASTEXITCODE -ne 0 -or -not $tagSha) {
            throw "release tag does not exist: $tag"
          }
          if ($tagSha.ToLower() -ne $head) {
            throw "tag $tag is $tagSha, HEAD is $head"
          }
          $csprojRaw = Get-Content windows/Snippr.Win.csproj -Raw
          $nsisRaw = Get-Content windows/installer.nsi -Raw
          if ($csprojRaw -notmatch '<Version>([^<]+)</Version>') {
            throw "csproj Version missing"
          }
          $csproj = $Matches[1].Trim()
          if ($nsisRaw -notmatch 'OutFile "SnipprSetup-([^"]+)-win-x64.exe"') {
            throw "NSIS OutFile version missing"
          }
          $nsisOut = $Matches[1].Trim()
          if ($nsisRaw -notmatch 'DisplayVersion" "([^"]+)"') {
            throw "NSIS DisplayVersion missing"
          }
          $nsisDisp = $Matches[1].Trim()
          $ver = $tag.TrimStart('v')
          Write-Host "tag=$tag ver=$ver csproj=$csproj nsisOut=$nsisOut nsisDisp=$nsisDisp"
          if ($ver -ne $csproj -or $ver -ne $nsisOut -or $ver -ne $nsisDisp) {
            throw "version mismatch: tag=$ver csproj=$csproj nsisOut=$nsisOut nsisDisp=$nsisDisp"
          }

      - name: Require signing secrets for release
        if: inputs.tag != ''
        shell: pwsh
        run: |
          if ($env:HAS_SIGNING -ne 'true') {
            throw "release upload requires Azure Trusted Signing secrets"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Stitcher gate (animated-band + majority fail-closed)
        run: >
          dotnet run --project windows/Snippr.Win.StitcherGate/Snippr.Win.StitcherGate.csproj
          -c Release --no-launch-profile

      - name: Build Win app (Release)
        run: dotnet build windows/Snippr.Win.csproj -c Release

      - name: Publish self-contained exe
        if: inputs.tag != ''
        run: >
          dotnet publish windows/Snippr.Win.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:TieredPGO=true

      - name: Stage exe next to installer script
        if: inputs.tag != ''
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path windows -Filter Snippr.exe |
            Where-Object { $_.FullName -like '*publish*' } | Select-Object -First 1
          if (-not $exe) { throw "publish output not found" }
          Write-Host "Found $($exe.FullName)"
          Copy-Item $exe.FullName windows/Snippr.exe

      - name: Sign Snippr.exe (Azure Trusted Signing)
        if: inputs.tag != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install NSIS
        if: inputs.tag != ''
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        if: inputs.tag != ''
        shell: pwsh
        working-directory: windows
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi'

      - name: Sign installer (Azure Trusted Signing)
        if: inputs.tag != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Portable ZIP
        if: inputs.tag != ''
        shell: pwsh
        run: >
          Compress-Archive -Path windows/Snippr.exe
          -DestinationPath windows/Snippr-portable-win-x64.zip -Force

      - name: Verify Authenticode and SHA-256
        if: inputs.tag != ''
        shell: pwsh
        run: |
          function Assert-Signed([string]$path) {
            if (-not (Test-Path $path)) { throw "missing $path" }
            $s = Get-AuthenticodeSignature $path
            Write-Host "$path Status=$($s.Status) Thumbprint=$($s.SignerCertificate.Thumbprint)"
            if ($s.Status -ne 'Valid') {
              throw "Authenticode not Valid: $path $($s.Status)"
            }
          }
          Assert-Signed windows/Snippr.exe
          $setup = @(Get-Item windows/SnipprSetup-*.exe -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) {
            throw "expected exactly 1 windows/SnipprSetup-*.exe, got $($setup.Count)"
          }
          Assert-Signed $setup[0].FullName
          $lines = @()
          foreach ($p in @('windows/Snippr.exe', $setup[0].FullName, 'windows/Snippr-portable-win-x64.zip')) {
            $h = Get-FileHash -Algorithm SHA256 $p
            $line = "$($h.Hash.ToLower())  $(Split-Path $p -Leaf)"
            Write-Host $line
            $lines += $line
          }
          $lines | Set-Content -Encoding ascii windows/SHA256SUMS

      - name: Upload to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "release tag must match ^v\\d+\\.\\d+\\.\\d+$ (got: $tag)"
          }
          $setup = @(Get-Item windows/SnipprSetup-*.exe -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) {
            throw "expected exactly 1 windows/SnipprSetup-*.exe, got $($setup.Count)"
          }
          # No --clobber: refuse to overwrite an existing release asset.
          # Tag is taken from $env:RELEASE_TAG (allowlisted), never interpolated into the script.
          gh release upload $tag `
            $setup[0].FullName `
            windows/Snippr-portable-win-x64.zip `
            windows/SHA256SUMS
