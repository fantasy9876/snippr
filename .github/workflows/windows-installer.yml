name: Windows installer

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact git SHA or ref to checkout and build (empty = selected branch HEAD)"
        required: false
        default: ""
      tag:
        description: "Existing release tag to upload the installer to (empty = gate+build only, no upload)"
        required: false
        default: ""
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-installer.yml"
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Signing turns on automatically once the Azure Trusted Signing
      # secrets are added in repo Settings → Secrets and variables → Actions.
      ENABLE_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' }}
      CHECKOUT_REF: ${{ inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Pin exact checkout
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          $want = $env:CHECKOUT_REF
          Write-Host "requested=$want"
          Write-Host "HEAD=$head"
          git log -1 --oneline
          # A 40-char hex request must land on that exact commit.
          if ($want -match '^[0-9a-fA-F]{40}$' -and $head -ne $want.ToLower()) {
            throw "checkout HEAD $head != requested $want"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Stitcher gate (animated-band + majority fail-closed)
        run: >
          dotnet run --project windows/Snippr.Win.StitcherGate/Snippr.Win.StitcherGate.csproj
          -c Release --no-launch-profile

      - name: Build Win app (Release)
        run: dotnet build windows/Snippr.Win.csproj -c Release

      - name: Publish self-contained exe
        if: github.event_name == 'workflow_dispatch'
        # ReadyToRun precompiles IL to native code: the tray app and the
        # editor open without paying JIT cost on first use.
        run: >
          dotnet publish windows/Snippr.Win.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:TieredPGO=true

      - name: Stage exe next to installer script
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path windows -Filter Snippr.exe |
            Where-Object { $_.FullName -like '*publish*' } | Select-Object -First 1
          if (-not $exe) { throw "publish output not found" }
          Write-Host "Found $($exe.FullName)"
          Copy-Item $exe.FullName windows/Snippr.exe

      - name: Sign Snippr.exe (Azure Trusted Signing)
        if: github.event_name == 'workflow_dispatch' && env.ENABLE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install NSIS
        if: github.event_name == 'workflow_dispatch'
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        working-directory: windows
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi'

      - name: Sign installer (Azure Trusted Signing)
        if: github.event_name == 'workflow_dispatch' && env.ENABLE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Portable ZIP
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: >
          Compress-Archive -Path windows/Snippr.exe
          -DestinationPath windows/Snippr-portable-win-x64.zip -Force

      - name: Upload to release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload ${{ inputs.tag }} (Get-Item windows/SnipprSetup-*.exe).FullName --clobber
          gh release upload ${{ inputs.tag }} windows/Snippr-portable-win-x64.zip --clobber
